<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerrard — Header</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-900:#1B1815;
    --ink-700:#2E2A24;
    --ink-500:#5A5449;
    --paper-050:#E9E4D8;
    --paper-000:#F4F1E9;
    --brass:#B8873B;
    --brass-dim:rgba(184,135,59,0.35);
    --line:rgba(27,24,21,0.12);
    --header-h:76px;

    --bg: var(--paper-000);
    --surface: var(--paper-050);
    --text: var(--ink-900);
    --text-dim: var(--ink-500);
    --border: var(--line);
    --accent: var(--brass);
  }
  [data-theme="dark"]{
    --bg: var(--ink-900);
    --surface: var(--ink-700);
    --text: var(--paper-000);
    --text-dim: rgba(244,241,233,0.6);
    --border: rgba(244,241,233,0.14);
    --accent: var(--brass);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    transition:background .35s ease, color .35s ease;
    min-height:100vh;
  }
  .container{max-width:1180px; margin:0 auto; padding:0 32px;}

  /* ---------- HEADER ---------- */
  .site-header{
    position:sticky; top:0; z-index:50;
    background:var(--bg);
    border-bottom:1px solid var(--border);
  }
  .nav-wrap{
    height:var(--header-h);
    display:flex; align-items:center; justify-content:space-between;
    gap:28px;
  }

  /* Brand: signet mark + tracked wordmark */
  .brand{
    display:flex; align-items:center; gap:12px;
    text-decoration:none; color:var(--text);
    font-family:'Fraunces', serif;
  }
  .brand-mark{
    width:36px; height:36px;
    display:flex; align-items:center; justify-content:center;
    border:1.5px solid var(--text);
    font-size:16px; font-weight:600;
    position:relative;
    transition:border-color .3s ease, transform .4s ease;
  }
  .brand-mark::after{
    content:"";
    position:absolute; top:3px; right:3px;
    width:5px; height:5px;
    background:var(--accent);
  }
  .brand:hover .brand-mark{ transform:rotate(-6deg); border-color:var(--accent); }
  .brand-word{
    font-size:19px; letter-spacing:0.14em; font-weight:500;
  }

  /* Nav links with sliding hairline indicator */
  .nav-links{
    display:flex; align-items:center; gap:2px; position:relative;
    flex:1; justify-content:center;
  }
  .nav-links a{
    position:relative;
    color:var(--text-dim);
    text-decoration:none;
    font-size:13.5px;
    letter-spacing:0.02em;
    padding:10px 16px;
    transition:color .25s ease;
    white-space:nowrap;
  }
  .nav-links a:hover, .nav-links a.active{ color:var(--text); }
  .nav-indicator{
    position:absolute; bottom:0; left:0; height:1.5px;
    width:0; background:var(--accent);
    transition:transform .35s cubic-bezier(.65,0,.35,1), width .35s cubic-bezier(.65,0,.35,1), opacity .2s ease;
    opacity:0;
  }
  .nav-links:hover .nav-indicator{ opacity:1; }

  .nav-right{ display:flex; align-items:center; gap:14px; }

  /* Theme toggle: pill with sliding thumb */
  .theme-toggle{
    width:52px; height:28px;
    border-radius:14px;
    border:1px solid var(--border);
    background:var(--surface);
    position:relative;
    cursor:pointer;
    padding:0;
    flex-shrink:0;
  }
  .theme-toggle::before{
    content:"";
    position:absolute; top:2px; left:2px;
    width:22px; height:22px;
    border-radius:50%;
    background:var(--accent);
    transition:transform .35s cubic-bezier(.65,0,.35,1);
  }
  [data-theme="dark"] .theme-toggle::before{ transform:translateX(24px); }
  .theme-toggle svg{
    position:absolute; top:6px; width:16px; height:16px;
    stroke:var(--bg); pointer-events:none; transition:opacity .2s ease;
  }
  .icon-moon{ left:6px; opacity:1; }
  .icon-sun{ right:6px; opacity:0; }
  [data-theme="dark"] .icon-moon{ opacity:0; }
  [data-theme="dark"] .icon-sun{ opacity:1; }

  /* Hamburger */
  .nav-toggle{
    display:none;
    width:32px; height:22px;
    background:none; border:none; cursor:pointer;
    flex-direction:column; justify-content:space-between;
    padding:0;
  }
  .nav-toggle span{
    display:block; height:1.5px; width:100%;
    background:var(--text);
    transition:transform .3s ease, opacity .3s ease;
  }
  .nav-toggle.open span:nth-child(1){ transform:translateY(9.5px) rotate(45deg); }
  .nav-toggle.open span:nth-child(2){ opacity:0; }
  .nav-toggle.open span:nth-child(3){ transform:translateY(-9.5px) rotate(-45deg); }

  /* ---------- MOBILE PANEL ---------- */
  .mobile-panel{
    display:none;
    flex-direction:column;
    background:var(--bg);
    border-top:1px solid var(--border);
    max-height:0;
    overflow:hidden;
    transition:max-height .4s cubic-bezier(.65,0,.35,1);
  }
  .mobile-panel.open{ max-height:520px; }
  .mobile-panel a{
    font-family:'Fraunces', serif;
    font-size:22px;
    color:var(--text);
    text-decoration:none;
    padding:16px 32px;
    border-bottom:1px solid var(--border);
  }
  .mobile-eyebrow{
    padding:14px 32px 0;
    font-size:11px; letter-spacing:0.18em; color:var(--text-dim);
  }

  @media (max-width: 860px){
    .nav-links{ display:none; }
    .nav-toggle{ display:flex; }
    .mobile-panel{ display:flex; }
    .container{ padding:0 20px; }
  }

  /* demo body content, not part of component */
  .demo{ max-width:640px; margin:80px auto; padding:0 32px; color:var(--text-dim); font-size:14px; line-height:1.7; }
  .demo h1{ font-family:'Fraunces', serif; font-weight:500; color:var(--text); font-size:28px; margin-bottom:12px;}
</style>
<script src="assets/js/access-gate.js"></script>
</head>
<body>

<header class="site-header">
  <div class="container nav-wrap">
    <a href="index.html" class="brand">
      <span class="brand-mark">G</span>
      <span class="brand-word">GERRARD</span>
    </a>

    <nav class="nav-links" id="navLinks">
      <a href="index.html" class="active">Home</a>
      <a href="about.html">About</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="services.html">Services</a>
      <a href="resume.html">Resume</a>
      <a href="blog.html">Blog</a>
      <a href="contact.html">Contact</a>
      <a href="cv.html">CV</a>
      <span class="nav-indicator" id="navIndicator"></span>
    </nav>

    <div class="nav-right">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle light and dark theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
    </div>
  </div>

  <div class="mobile-panel" id="mobilePanel">
    <div class="mobile-eyebrow">MENU</div>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="services.html">Services</a>
    <a href="resume.html">Resume</a>
    <a href="blog.html">Blog</a>
    <a href="contact.html">Contact</a>
    <a href="cv.html">CV</a>
  </div>
</header>

<div class="demo">
  <h1>Header preview</h1>
  <p>Resize the window to see the mobile menu, hover the nav to see the hairline indicator track between links, and click the pill toggle to switch themes.</p>
</div>

<script>
  // Theme toggle
  const themeToggle = document.getElementById('themeToggle');
  themeToggle.addEventListener('click', () => {
    const root = document.documentElement;
    const isDark = root.getAttribute('data-theme') === 'dark';
    root.setAttribute('data-theme', isDark ? 'light' : 'dark');
  });

  // Mobile menu
  const navToggle = document.getElementById('navToggle');
  const mobilePanel = document.getElementById('mobilePanel');
  navToggle.addEventListener('click', () => {
    navToggle.classList.toggle('open');
    mobilePanel.classList.toggle('open');
  });

  // Sliding nav indicator
  const navLinks = document.getElementById('navLinks');
  const indicator = document.getElementById('navIndicator');
  const links = navLinks.querySelectorAll('a');

  function moveIndicatorTo(el){
    const navRect = navLinks.getBoundingClientRect();
    const rect = el.getBoundingClientRect();
    indicator.style.width = rect.width + 'px';
    indicator.style.transform = `translateX(${rect.left - navRect.left}px)`;
  }

  links.forEach(link => {
    link.addEventListener('mouseenter', () => moveIndicatorTo(link));
  });
  navLinks.addEventListener('mouseleave', () => {
    const active = navLinks.querySelector('a.active');
    if(active) moveIndicatorTo(active);
  });

  window.addEventListener('load', () => {
    const active = navLinks.querySelector('a.active');
    if(active){ moveIndicatorTo(active); indicator.style.opacity = '1'; }
  });
  window.addEventListener('resize', () => {
    const active = navLinks.querySelector('a.active');
    if(active) moveIndicatorTo(active);
  });
</script>

</body>
</html>
